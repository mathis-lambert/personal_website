services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPS_PUBLIC_KEY: ${NEXT_PUBLIC_MAPS_PUBLIC_KEY}
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
        NEXT_PUBLIC_MAINTENANCE_MODE: ${NEXT_PUBLIC_MAINTENANCE_MODE:-false}
    container_name: personal_website_dev
    restart: unless-stopped
    env_file: [".env"]
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      ML_API_BASE_URL: ${ML_API_BASE_URL}
      ML_API_KEY: ${ML_API_KEY}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-openai/gpt-oss-120b}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DB: ${MONGODB_DB}
      ANALYTICS_LOG_RETENTION_DAYS: ${ANALYTICS_LOG_RETENTION_DAYS:-180}
      ANALYTICS_HASH_SALT: ${ANALYTICS_HASH_SALT:-dev-analytics-salt}
      CHAT_LOG_RETENTION_DAYS: ${CHAT_LOG_RETENTION_DAYS:-365}
      CHAT_LOG_MAX_TEXT_CHARS: ${CHAT_LOG_MAX_TEXT_CHARS:-4000}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-media}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-https://cdn.mathislambert.fr}
      MEDIA_S3_FORCE_PATH_STYLE: ${MEDIA_S3_FORCE_PATH_STYLE:-true}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://cdn.mathislambert.fr/media}
    ports:
      - "3000:3000"
    networks: [app-network]

networks:
  app-network:
    driver: bridge
